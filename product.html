<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <header class="main-header">
    <div class="logo">MyShop</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="men.html">Men</a>
      <a href="women.html">Women</a>
      <a href="shoes.html">Shoes</a>
      <a href="bags.html">Bags</a>
      <a href="gadgets.html">Gadgets</a>
      <a href="accessories.html">Accessories</a>
    </nav>
  </header>

  <!-- Product Details Section -->
  <section class="product-details">
    <div class="product-image">
      <img src="images/shirt1.jpg" alt="Product">
    </div>

    <div class="product-info">
      <h2>Classic Cotton Shirt</h2>
      <p class="price">Ksh 1,200</p>
      <p class="description">
        This stylish cotton shirt is perfect for casual and formal wear. 
        Made with breathable fabric for all-day comfort.
      </p>
      
      <label for="size">Size:</label>
      <select id="size">
        <option>S</option>
        <option>M</option>
        <option>L</option>
        <option>XL</option>
      </select>

      <button class="add-to-cart">Add to Cart</button>
    </div>
  </section>

</body>
</html>
