<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Purchases</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f5f5;
    }

    header {
      background: #333;
      color: #fff;
      padding: 15px;
      text-align: center;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    h2 {
      margin-bottom: 20px;
      color: #444;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      text-align: left;
      padding: 12px;
      border-bottom: 1px solid #ddd;
    }

    th {
      background: #f0f0f0;
    }

    tr:hover {
      background: #f9f9f9;
    }

    .empty-message {
      text-align: center;
      padding: 30px;
      color: #777;
    }

    .total {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
      text-align: right;
    }
  </style>
</head>
<body>
  <header>
    <h1>My Purchases</h1>
  </header>

  <div class="container">
    <h2>Purchased Items</h2>
    <div id="empty-message" class="empty-message" style="display:none;">
      You have no purchases yet.
    </div>
    <table id="purchases-table" style="display:none;">
      <thead>
        <tr>
          <th>Product</th>
          <th>Size</th>
          <th>Price</th>
          <th>Quantity</th>
          <th>Total</th>
        </tr>
      </thead>
      <tbody id="purchases-body">
      </tbody>
    </table>
    <div id="purchase-summary" class="total"></div>
  </div>

  <script>
    function loadPurchases() {
      // get purchases from localStorage
      let purchases = JSON.parse(localStorage.getItem("purchases")) || [];
      let table = document.getElementById("purchases-table");
      let tbody = document.getElementById("purchases-body");
      let summary = document.getElementById("purchase-summary");
      let emptyMessage = document.getElementById("empty-message");

      tbody.innerHTML = "";
      summary.innerHTML = "";

      if (purchases.length === 0) {
        table.style.display = "none";
        emptyMessage.style.display = "block";
        return;
      }

      emptyMessage.style.display = "none";
      table.style.display = "table";

      let total = 0;
      purchases.forEach(item => {
        let row = document.createElement("tr");
        let itemTotal = item.price * item.quantity;
        total += itemTotal;

        row.innerHTML = `
          <td>${item.name}</td>
          <td>${item.size || "-"}</td>
          <td>Ksh ${item.price}</td>
          <td>${item.quantity}</td>
          <td>Ksh ${itemTotal}</td>
        `;

        tbody.appendChild(row);
      });

      summary.innerHTML = "Grand Total: Ksh " + total;
    }

    window.onload = loadPurchases;
  </script>
</body>
</html>
